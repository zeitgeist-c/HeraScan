name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches app version
        shell: bash
        run: |
          app_version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          tag_version="${GITHUB_REF_NAME#v}"
          test "$app_version" = "$tag_version"

      - name: Test, lint, and build APK
        run: ./gradlew test lint assembleDebug

      - name: Name release package
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk "HeraScan-${GITHUB_REF_NAME#v}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: HeraScan-*.apk
